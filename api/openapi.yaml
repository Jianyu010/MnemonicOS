openapi: 3.1.0
info:
  title: MnemonicOS Local API
  version: 0.5.0
  description: Local API for raw capture, ingest, sync, retrieval, trust/freshness scoring, graph expansion, maintenance jobs, and the shared orchestrator facade.
servers:
  - url: http://127.0.0.1:8000
paths:
  /v1/health:
    get:
      operationId: health
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                  db_ready:
                    type: boolean
                required: [status, db_ready]

  /v1/ingest/session:
    post:
      operationId: ingestSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestSessionRequest'
      responses:
        '200':
          description: Session ingested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestSessionResponse'

  /v1/ingest/artifact:
    post:
      operationId: ingestArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestArtifactRequest'
      responses:
        '200':
          description: Artifact ingested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestArtifactResponse'

  /v1/reprocess/artifact:
    post:
      operationId: reprocessArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReprocessArtifactRequest'
      responses:
        '200':
          description: Artifact reprocessed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/IngestArtifactResponse'
                  - $ref: '#/components/schemas/ReprocessArtifactBatchResponse'

  /v1/capture/begin-episode:
    post:
      operationId: captureBeginEpisode
      summary: Begin a software-enforced raw capture episode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeginEpisodeRequest'
      responses:
        '200':
          description: Episode initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeginEpisodeResponse'

  /v1/capture/append-event:
    post:
      operationId: captureAppendEvent
      summary: Append one raw event to an episode JSONL log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendEventRequest'
      responses:
        '200':
          description: Event appended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppendEventResponse'

  /v1/capture/end-episode:
    post:
      operationId: captureEndEpisode
      summary: End a raw capture episode and finalize episode metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndEpisodeRequest'
      responses:
        '200':
          description: Episode finalized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndEpisodeResponse'

  /v1/extraction/queue:
    post:
      operationId: queueExtraction
      summary: Queue a west-flange source for LLM/VLM extraction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractionQueueRequest'
      responses:
        '200':
          description: Extraction queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionQueueItem'

  /v1/extraction/process:
    post:
      operationId: processExtraction
      summary: Process pending extraction rows.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractionProcessRequest'
      responses:
        '200':
          description: Extraction processing stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionProcessResponse'

  /v1/extraction/status:
    get:
      operationId: extractionStatus
      summary: Inspect extraction queue status.
      parameters:
        - name: queue_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Extraction status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/sync/vault:
    post:
      operationId: syncVault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncVaultRequest'
      responses:
        '200':
          description: Vault synchronized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncVaultResponse'

  /v1/promotion/process:
    post:
      operationId: processPromotion
      summary: Process promotion-ready extraction candidates.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromotionProcessRequest'
      responses:
        '200':
          description: Promotion processing stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionProcessResponse'

  /v1/promotion/status:
    get:
      operationId: promotionStatus
      summary: Inspect promotion queue status.
      responses:
        '200':
          description: Promotion status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionStatusResponse'

  /v1/retrieve:
    post:
      operationId: retrieve
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrieveRequest'
      responses:
        '200':
          description: Retrieval results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveResponse'

  /v1/jobs/run:
    post:
      operationId: runJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunJobRequest'
      responses:
        '200':
          description: Job executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunJobResponse'

  /v1/orchestrator/begin-task:
    post:
      operationId: orchestratorBeginTask
      summary: Resolve MnemonicOS context before an LLM call.
      description: >
        Infers task_kind, temporality, and token_budget when not supplied.
        Returns a context_markdown string ready to prepend to the system prompt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrchestratorTaskRequest'
      responses:
        '200':
          description: Context resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchestratorContextResult'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/orchestrator/mark-failure:
    post:
      operationId: orchestratorMarkFailure
      summary: Record a failure and re-resolve context, preserving task_id.
      description: >
        Records an intermediate failure outcome then calls begin-task again with
        the failure text as the query.  The same task_id is preserved so the full
        attempt chain is linked in the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrchestratorMarkFailureRequest'
      responses:
        '200':
          description: Failure recorded; refreshed context returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchestratorContextResult'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/orchestrator/finish-task:
    post:
      operationId: orchestratorFinishTask
      summary: Record the final outcome and compute a writeback decision.
      description: >
        Calls record_outcome then decide_writeback_runtime.  Callers hand off to
        ingest/archive when the returned decision is not "skip".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrchestratorOutcomeRequest'
      responses:
        '200':
          description: Outcome recorded; writeback decision returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchestratorWritebackResult'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    IngestSessionRequest:
      type: object
      properties:
        bridge_id:
          type: string
        session_id:
          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string
        source_refs:
          type: array
          items:
            type: string
        agent:
          type: string
          deprecated: true
        slug:
          type: string
          deprecated: true
      required: [bridge_id, session_id, content]

    IngestSessionResponse:
      type: object
      properties:
        archive_id:
          type: string
        promoted_notes:
          type: array
          items:
            type: string
        review_items:
          type: array
          items:
            type: string
        raw_path:
          type: string
        chunk_count:
          type: integer
      required: [archive_id, raw_path, chunk_count, promoted_notes, review_items]

    IngestArtifactRequest:
      type: object
      properties:
        path:
          type: string
          description: Local path to the raw artifact file.
        tags:
          type: array
          items:
            type: string
        attachments:
          type: array
          description: Source-provided companion files to archive as true raw attachments.
          items:
            type: string
      required: [path]

    IngestArtifactResponse:
      type: object
      properties:
        archive_id:
          type: string
        raw_path:
          type: string
        manifest_path:
          type: string
        ingest_status:
          type: string
          enum: [accepted, accepted_with_warnings, failed_extraction, manual_fix_needed]
        source_format:
          type: string
        figure_count:
          type: integer
        warnings:
          type: array
          items:
            type: string
        failure_reason:
          type: string
        needs_visual_pass:
          type: boolean
        needs_manual_projection:
          type: boolean
        image_only_pdf:
          type: boolean
      required: [archive_id, raw_path, manifest_path, ingest_status, source_format,
                 figure_count, warnings, needs_visual_pass, needs_manual_projection,
                 image_only_pdf]

    ReprocessArtifactRequest:
      type: object
      properties:
        archive_id:
          type: string
          description: Artifact archive id to reprocess.
        failed:
          type: boolean
          default: false
          description: Reprocess all artifacts currently marked failed_extraction.

    ReprocessArtifactBatchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/IngestArtifactResponse'
      required: [results]

    BeginEpisodeRequest:
      type: object
      properties:
        bridge_id:
          type: string
        conversation_id:
          type: string
          description: Durable thread id. Generated or recovered from bridge state when absent.
        episode_id:
          type: string
          description: Visit/run id. Generated when absent.
        parent_conversation_id:
          type: string
        related_conversation_ids:
          type: array
          items:
            type: string
        task_id:
          type: string
        cwd:
          type: string
        repo:
          type: string
        branch:
          type: string
        model:
          type: string
        agent_runtime:
          type: string
        platform_thread_id:
          type: string
        metadata:
          type: object
          additionalProperties: true
      required: [bridge_id]

    BeginEpisodeResponse:
      type: object
      properties:
        conversation_id:
          type: string
        episode_id:
          type: string
        conversation_path:
          type: string
        episode_path:
          type: string
        events_path:
          type: string
        transcript_path:
          type: string
        artifacts_path:
          type: string
      required: [conversation_id, episode_id, conversation_path, episode_path,
                 events_path, transcript_path, artifacts_path]

    AppendEventRequest:
      type: object
      properties:
        bridge_id:
          type: string
        conversation_id:
          type: string
        episode_id:
          type: string
        type:
          type: string
          enum: [episode_started, user_message, assistant_message, tool_call, tool_result,
                 file_changed, artifact_created, retrieval_packet, failure, branch_started,
                 branch_completed, conversation_reference, episode_ended]
        payload:
          type: object
          additionalProperties: true
        task_id:
          type: string
        branch_id:
          type: string
          default: main
        timestamp:
          type: string
          description: Optional ISO timestamp supplied by the bridge.
      required: [bridge_id, conversation_id, episode_id, type]

    AppendEventResponse:
      type: object
      properties:
        conversation_id:
          type: string
        episode_id:
          type: string
        seq:
          type: integer
        events_path:
          type: string
        transcript_path:
          type: string
        artifact_paths:
          type: array
          items:
            type: string
      required: [conversation_id, episode_id, seq, events_path, transcript_path, artifact_paths]

    EndEpisodeRequest:
      type: object
      properties:
        bridge_id:
          type: string
        conversation_id:
          type: string
        episode_id:
          type: string
        status:
          type: string
          enum: [success, failure, partial, abandoned]
          default: success
        metadata:
          type: object
          additionalProperties: true
      required: [bridge_id, conversation_id, episode_id]

    EndEpisodeResponse:
      type: object
      properties:
        conversation_id:
          type: string
        episode_id:
          type: string
        status:
          type: string
        event_count:
          type: integer
        content_hash:
          type: string
        manifest_path:
          type: string
      required: [conversation_id, episode_id, status, event_count, content_hash, manifest_path]

    SyncVaultRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [incremental, full]
        paths:
          type: array
          items:
            type: string
      required: [mode]

    SyncVaultResponse:
      type: object
      properties:
        scanned_paths:
          type: integer
        synced_notes:
          type: integer
        deleted_notes:
          type: integer
        parse_errors:
          type: integer
      required: [scanned_paths, synced_notes, deleted_notes, parse_errors]

    RetrieveRequest:
      type: object
      properties:
        query:
          type: string
        top_k:
          type: integer
          default: 5
        query_type_hint:
          type: string
        include_archive_fallback:
          type: boolean
          default: true
        include_body:
          type: boolean
          default: false
          description: Hydrate selected wiki hits with note body text for explicit inspection/debug output.
        body_chars:
          type: integer
          minimum: 0
          description: Maximum characters to include for each hydrated body.
      required: [query]

    RetrieveResponse:
      type: object
      properties:
        query_id:
          type: integer
        query_type:
          type: string
        classifier_confidence:
          type: number
        hits:
          type: array
          items:
            $ref: '#/components/schemas/NoteHit'
      required: [query_id, hits]

    NoteHit:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
        status:
          type: string
        body_path:
          type: string
        summary:
          type: string
        body:
          type: string
          description: Present only for wiki hits when retrieve request sets include_body.
        body_truncated:
          type: boolean
          description: True when hydrated body text was capped by body_chars.
        channels:
          type: array
          items:
            type: string
        raw_score:
          type: number
        final_score:
          type: number
        excerpt:
          type: string
      required: [id, title, type, body_path, channels, final_score]

    RunJobRequest:
      type: object
      properties:
        job_name:
          type: string
          enum: [sync_vault_incremental, process_extraction_queue, process_promotion_queue, expire_stale_episodes, embed_backfill, status_report, wiki_graph_rebuild, wiki_lifecycle_audit, wiki_importance_scoring, wiki_health_report, wiki_embedding_neighbor_backfill, wiki_cluster_validation, wiki_pattern_discovery, wiki_raw_revisitation]
        dry_run:
          type: boolean
          default: false
      required: [job_name]

    ExtractionQueueRequest:
      type: object
      properties:
        source_kind:
          type: string
          enum: [artifact, episode, session]
        archive_id:
          type: string
        conversation_id:
          type: string
        episode_id:
          type: string
        bridge_id:
          type: string
        session_id:
          type: string
        task_id:
          type: string
      required: [source_kind]

    ExtractionQueueItem:
      type: object
      properties:
        id:
          type: integer
        source_kind:
          type: string
        archive_id:
          type: string
        conversation_id:
          type: string
        episode_id:
          type: string
        status:
          type: string
        attempt_count:
          type: integer
        last_error:
          type: string
      required: [id, source_kind, status, attempt_count]

    ExtractionProcessRequest:
      type: object
      properties:
        dry_run:
          type: boolean
          default: false

    ExtractionProcessResponse:
      type: object
      properties:
        processed:
          type: integer
        skipped:
          type: integer
        errors:
          type: integer
        windows:
          type: integer
        artifacts:
          type: integer
        visual_snippets:
          type: integer
        candidates:
          type: integer
        promotion_ready:
          type: integer
      required: [processed, skipped, errors, windows, artifacts, visual_snippets, candidates, promotion_ready]

    PromotionProcessRequest:
      type: object
      properties:
        dry_run:
          type: boolean
          default: false

    PromotionProcessResponse:
      type: object
      properties:
        promoted:
          type: integer
        review_routed:
          type: integer
        rejected:
          type: integer
        requeued:
          type: integer
        skipped:
          type: integer
        relations_applied:
          type: integer
        errors:
          type: integer
      required: [promoted, review_routed, rejected, requeued, skipped, relations_applied, errors]

    PromotionStatusResponse:
      type: object
      properties:
        promotion_ready:
          type: integer
        promoted:
          type: integer
        review_routed:
          type: integer
        rejected:
          type: integer
        last_run_at:
          type: [string, "null"]
      required: [promotion_ready, promoted, review_routed, rejected]

    RunJobResponse:
      type: object
      properties:
        job_name:
          type: string
        status:
          type: string
        stats:
          type: object
          additionalProperties: true
        review_items_created:
          type: array
          items:
            type: string
      required: [job_name, status, stats, review_items_created]

    # -----------------------------------------------------------------------
    # Orchestrator schemas
    # -----------------------------------------------------------------------

    OrchestratorTaskRequest:
      type: object
      properties:
        bridge_id:
          type: string
          description: Agent identifier (e.g. "claude", "codex", "firm-agent-x").
        task_text:
          type: string
          description: The user's task or prompt text.
        session_id:
          type: string
          description: Session identifier. Auto-generated when absent.
        task_id:
          type: string
          description: Task identifier. Auto-generated when absent.
        task_kind:
          type: string
          description: >
            Hint for retrieval tuning: coding, debugging, architecture, research, general.
            Inferred from task_text when absent.
        temporality:
          type: string
          enum: [current, historical, mixed, unknown]
          description: Inferred from task_kind when absent.
        token_budget:
          type: integer
          description: Max tokens for the injected memory packet. Defaulted by task_kind.
        workspace:
          type: string
        project:
          type: string
        repo:
          type: string
        tags:
          type: array
          items:
            type: string
      required: [bridge_id, task_text]

    OrchestratorContextResult:
      type: object
      properties:
        task_id:
          type: string
        session_id:
          type: string
        retrieval_state:
          type: string
          description: >
            sufficient_current | sufficient_historical | partial |
            insufficient_no_hit | insufficient_stale | insufficient_contested
        recommendation:
          type: string
          description: reuse | reuse_with_verification | research_fresh
        verification_action:
          type: string
          description: none | verify_current_truth | check_recent_sources | treat_as_historical_only
        task_kind:
          type: string
        temporality:
          type: string
        query_id:
          type: integer
        context_markdown:
          type: string
          description: Pre-formatted ## Memory Context block ready for system-prompt injection.
        memory_packet:
          type: object
          description: Structured memory packet (primary, related, warnings, verification_needed).
          additionalProperties: true
      required: [task_id, session_id, retrieval_state, recommendation, verification_action,
                 task_kind, temporality, query_id, context_markdown, memory_packet]

    OrchestratorMarkFailureRequest:
      type: object
      properties:
        bridge_id:
          type: string
        session_id:
          type: string
        task_id:
          type: string
        failure_text:
          type: string
          description: Description of the failure used as the re-resolution query.
        task_kind:
          type: string
          default: general
        query_id:
          type: integer
        retrieval_state:
          type: string
      required: [bridge_id, session_id, task_id, failure_text]

    OrchestratorOutcomeRequest:
      type: object
      properties:
        bridge_id:
          type: string
        session_id:
          type: string
        task_id:
          type: string
        status:
          type: string
          enum: [success, failure, partial]
        outcome_type:
          type: string
          description: "e.g. coding, debugging, research, general"
        summary:
          type: string
          description: Structured summary markdown. Parsed for writeback note_type and title.
        query_id:
          type: integer
        retrieval_state:
          type: string
        recommendation:
          type: string
        useful_ids:
          type: array
          items:
            type: string
        misleading_ids:
          type: array
          items:
            type: string
        fresh_sources_checked:
          type: array
          items:
            type: string
        note_type:
          type: string
          description: Override parsed note type (concept, procedure, decision, incident).
        title:
          type: string
          description: Override parsed note title.
        writeback_intent:
          type: string
          enum: [skip, confirm, update, new, incident_only, procedure_refinement]
      required: [bridge_id, session_id, task_id, status, outcome_type, summary]

    OrchestratorWritebackResult:
      type: object
      properties:
        task_id:
          type: string
        session_id:
          type: string
        outcome_status:
          type: string
          description: '"accepted" when record_outcome succeeded.'
        candidate_note_ids:
          type: array
          items:
            type: string
        decision:
          type: string
          enum: [skip, confirm, update, new, incident_only, procedure_refinement]
        targets:
          type: array
          items:
            type: string
          description: Note IDs to update (populated when decision is update or confirm).
        candidates:
          type: array
          items:
            type: string
          description: Note IDs that were considered.
        reason:
          type: string
      required: [task_id, session_id, outcome_status, candidate_note_ids, decision, targets, candidates, reason]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        detail:
          type: string
      required: [error]
