[paths]
vault_root = "brain"
db_path = "brain/data/archive.db"
vectors_dir = "brain/data/vectors"
graph_dir = "brain/data/graph"
eval_queries = "evals/queries.jsonl"

[retrieval]
# top_k is deprecated; use min_hits/max_hits/pool_fraction instead.
# When set, it acts only as an explicit caller override cap.
top_k = 5
include_archive_fallback = true
pinned_token_budget = 2000
total_context_budget = 6000
bm25_weight = 0.30
semantic_weight = 0.25
type_prior_weight = 0.15
freshness_weight = 0.10
memory_strength_weight = 0.10
importance_weight = 0.10
quality_weight = 0.08
exact_alias_weight = 0.10
# Phase 6: multiplicative scoring + relevance gate
min_relevance_score = 0.25
bm25_saturation = 15.0
# Phase 4 (updated): dynamic top-k
min_hits = 3
max_hits = 15
pool_fraction = 0.10
tokens_per_hit_estimate = 120

[ingest]
chunk_tokens = 400
chunk_overlap_tokens = 50
default_archive_type = "session"
explicit_markers_only = false
auto_trigger_pipeline = true

[text_processing]
cjk_enabled = true
cjk_ngram_min = 1
cjk_ngram_max = 3
latin_min_token_chars = 3

[embeddings]
enabled = true
provider = "hash"
model = "hash-256-v1"
dimensions = 256
base_url = ""
api_key_env = ""
timeout_seconds = 60
reembed_on_summary_change_only = true

# Optional provider-shaped model config. These keys override the legacy
# [extraction] provider keys when present. Ollama remains supported, but any
# OpenAI-compatible endpoint can be used for text extraction.
#
# [models.llm]
# provider = "openai_compatible"
# model = "qwen3"
# base_url = "http://127.0.0.1:8000/v1"
# api_key_env = "OPENAI_API_KEY"
# timeout_seconds = 180
#
# [models.vlm]
# provider = "ollama"
# model = "llama3.2-vision:latest"
# base_url = "http://127.0.0.1:11434"
# timeout_seconds = 180

# [extraction]
# Two-lane concurrent extraction: run one quick item (episode/session/text)
# and one slow item (PDF/DOCX/other) simultaneously. Requires OLLAMA_NUM_PARALLEL=2.
# dual_lane_enabled = false
# quick_lane_batch = 5           # max quick items fetched per job run
# slow_lane_batch = 5            # max slow items fetched per job run
# stall_timeout_seconds = 900    # kill subprocess if no progress for this many seconds (default 900)
#                                # MUST be > llm_timeout_seconds and > vlm_timeout_seconds so the
#                                # HTTP timeout fires before the stall detector kills the process.
# max_extraction_item_seconds = 7200  # absolute safety-net timeout (default 7200 = 2 h)
# vlm_timeout_seconds = 240      # per-artifact VLM HTTP timeout; must be < stall_timeout_seconds (default 240)
# max_vlm_artifacts_per_item = 24  # VLM calls per item; keep max_vlm_artifacts_per_item * vlm_timeout_seconds
#                                  # well under max_extraction_item_seconds. Extra figures are stored as
#                                  # skipped snippets. Snippets are checkpointed per artifact, so a killed
#                                  # VLM pass resumes where it stopped.
# llm_timeout_seconds = 600      # per-window LLM HTTP timeout; must be < stall_timeout_seconds (default 600)

[graph]
enabled = true
focal_limit = 3
expand_limit = 8
graph_weight = 0.20

[trust]
min_training_samples = 8
current_query_stale_penalty = 0.30
current_query_contested_penalty = 0.65
historical_query_relief = 0.20
section_limit = 5

[promotion]
enabled = true
max_components_per_candidate = 50
max_candidates_per_run = 20
min_confidence_for_direct_write = "medium"
auto_review_on_conflict = true
retry_after_hours = 24

[jobs]
sync_on_startup = true
sync_after_ingest = true

[daemon]
socket_path = "brain/data/mnemonic.sock"
pid_path = "brain/data/mnemonic.pid"
log_path = "brain/logs/daemon.log"
max_pending = 200
max_oldest_age_minutes = 1440
stale_episode_threshold_hours = 2
# If true, the daemon starts this Ollama command and owns its lifetime.
# Leave false when using the macOS Ollama.app or any shared Ollama server.
ollama_managed = false
ollama_command = ""

[daemon.schedules]
process_extraction_queue = "*/5 * * * *"
process_promotion_queue = "*/5 * * * *"
expire_stale_episodes = "0 * * * *"
embed_backfill = "15 * * * *"
status_report = "0 * * * *"
wiki_embedding_neighbor_backfill = "20 * * * *"
wiki_cluster_validation = "25 * * * *"
wiki_pattern_discovery = "30 * * * *"
wiki_graph_rebuild = "35 * * * *"
wiki_lifecycle_audit = "40 * * * *"
wiki_importance_scoring = "45 * * * *"
wiki_health_report = "50 * * * *"
wiki_raw_revisitation = "0 2 * * *"
wiki_derive_passive_feedback = "*/30 * * * *"

# Maintenance settings (including passive feedback) live in the single
# [maintenance] table further down. TOML rejects a table declared twice.

[bridges.local_cli]
session_prefix = "local-cli"
can_promote = false

[bridges.automation]
session_prefix = "automation"
can_promote = true

# ---------------------------------------------------------------------------
# Reranker — historical bonus values, diversity cap, archive hit floor
# ---------------------------------------------------------------------------
[reranker]
historical_bonus_max = 0.20          # normalization ceiling for quality_weight_sum_max
historical_bonus_stale = 0.20        # bonus for stale notes on historical queries
historical_bonus_suspect = 0.12
historical_bonus_aging = 0.06
min_type_prior_weight = 0.25         # floor applied when classifier confidence == 1.0
min_freshness_weight_what_changed = 0.25  # floor applied for what_changed queries
chain_diversity_min = 2              # min results allowed per chain before cap kicks in
min_archive_hits = 3                 # minimum archive hits emitted alongside wiki hits

# ---------------------------------------------------------------------------
# Signal — freshness scoring and quality classification thresholds
# ---------------------------------------------------------------------------
[signal]
default_freshness_score = 0.20       # used when note has no date
freshness_max_age_days = 365         # days at which freshness score reaches 0.0
min_summary_word_count = 8           # min words for "useful" quality classification
min_excerpt_word_count = 20          # min words for excerpt to count as signal
excerpt_char_limit = 240             # chars used when body is the excerpt fallback
passive_used_weight = 0.30           # confidence weight for passive_used_likely label
passive_useful_weight = 0.60         # confidence weight for passive_useful_likely label
passive_misleading_weight = 0.60     # confidence weight for passive_misleading_likely label

# ---------------------------------------------------------------------------
# Query parser — confidence formula and term extraction limits
# ---------------------------------------------------------------------------
[query_parser]
confidence_base = 0.45               # baseline classification confidence
confidence_primary_bonus = 0.20      # added per primary keyword hit
confidence_secondary_bonus = 0.10    # added per secondary keyword hit
max_anchor_terms = 5                 # max anchor terms extracted per query
max_candidate_tokens = 5             # max eligible tokens considered for anchor lookup
max_expanded_terms = 3               # max synonym/title-expansion terms added

# ---------------------------------------------------------------------------
# Orchestrator — token budgets and retry limits
# ---------------------------------------------------------------------------
[orchestrator]
default_token_budget = 3000          # default context token budget for most task kinds
research_token_budget = 5000         # budget for architecture/research/knowledge tasks
max_focused_retries = 1              # max focused-requery retries per retrieval cycle

# ---------------------------------------------------------------------------
# Bridge matching — candidate identity score thresholds
# ---------------------------------------------------------------------------
[bridge_matching]
exact_title_score = 1.00             # case-insensitive exact title match
id_slug_score = 0.99                 # note ID ends with slug
slug_score = 0.98                    # slug equals note title slug
alias_exact_score = 0.96             # alias matches title exactly
min_candidate_score = 0.55           # minimum score to include in candidate list
candidate_limit = 5                  # max candidates returned per find_existing_candidates call

# ---------------------------------------------------------------------------
# Maintenance — full set including passive feedback and importance scoring
# ---------------------------------------------------------------------------
[maintenance]
lifecycle_verified_threshold = 2
lifecycle_canonical_threshold = 4
lifecycle_drift_days = 30
graph_rebuild_enabled = true
lifecycle_audit_enabled = true
importance_scoring_enabled = true
semantic_dedup_threshold = 0.92
semantic_dedup_enabled = true
embedding_neighbor_enabled = true
neighbor_similarity_threshold = 0.78
neighbor_k = 10
neighbor_scan_max_age_days = 7
cluster_validation_enabled = true
cluster_validation_max_size = 12
cluster_validation_min_cluster_size = 2
pattern_discovery_enabled = true
requeue_enabled = true
requeue_min_age_days = 30
requeue_context_enabled = true
requeue_context_top_k = 5
requeue_max_per_run = 20
passive_feedback_enabled = true
passive_feedback_inline_only = false
passive_inline_boost_threshold = 0.85
passive_weak_confidence_default = 0.20
passive_misleading_min_confidence = 0.50
passive_max_promoted_per_session = 10
passive_retrieval_hits_limit = 500
pattern_role_similarity_threshold = 0.85
pattern_ch3_candidate_score = 0.70
pattern_ch2_max_pairs = 20
importance_out_degree_weight = 0.40
importance_sigmoid_scale = 5.0
importance_sigmoid_amp = 2.0
importance_connectivity_weight = 0.35
importance_trust_weight = 0.25
importance_freshness_weight = 0.25
importance_lifecycle_weight = 0.15
lifecycle_weight_canonical = 1.00
lifecycle_weight_verified = 0.70
lifecycle_weight_draft = 0.40
lifecycle_weight_review = 0.30
lifecycle_weight_contested = 0.20
lifecycle_weight_archived = 0.05
