[paths]
vault_root = "brain"
db_path = "brain/data/archive.db"
vectors_dir = "brain/data/vectors"
graph_dir = "brain/data/graph"
eval_queries = "evals/queries.jsonl"

[retrieval]
top_k = 5
include_archive_fallback = true
pinned_token_budget = 2000
total_context_budget = 6000
bm25_weight = 0.30
semantic_weight = 0.25
type_prior_weight = 0.15
freshness_weight = 0.10
memory_strength_weight = 0.10
exact_alias_weight = 0.10

[ingest]
chunk_tokens = 400
chunk_overlap_tokens = 50
default_archive_type = "session"
explicit_markers_only = false
auto_trigger_pipeline = true

[embeddings]
enabled = true
provider = "hash"
model = "hash-256-v1"
dimensions = 256
reembed_on_summary_change_only = true

[graph]
enabled = true
focal_limit = 3
expand_limit = 8
graph_weight = 0.20

[trust]
min_training_samples = 8
current_query_stale_penalty = 0.30
current_query_contested_penalty = 0.65
historical_query_relief = 0.20
section_limit = 5

[promotion]
enabled = true
max_components_per_candidate = 50
max_candidates_per_run = 20
min_confidence_for_direct_write = "medium"
auto_review_on_conflict = true
retry_after_hours = 24

[jobs]
sync_on_startup = true
sync_after_ingest = true
daily_consolidation = "0 3 * * *"
weekly_hygiene = "0 4 * * 0"

[daemon]
socket_path = "brain/data/mnemonic.sock"
pid_path = "brain/data/mnemonic.pid"
log_path = "brain/logs/daemon.log"
max_pending = 200
max_oldest_age_minutes = 1440
stale_episode_threshold_hours = 2

[daemon.schedules]
process_extraction_queue = "*/5 * * * *"
process_promotion_queue = "*/5 * * * *"
expire_stale_episodes = "0 * * * *"
embed_backfill = "15 * * * *"
daily_consolidation = "0 3 * * *"
weekly_hygiene = "0 4 * * 0"
status_report = "0 * * * *"

[bridges.local_cli]
session_prefix = "local-cli"
can_promote = false

[bridges.automation]
session_prefix = "automation"
can_promote = true
