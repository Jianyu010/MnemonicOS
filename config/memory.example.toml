[paths]
vault_root = "brain"
db_path = "brain/data/archive.db"
vectors_dir = "brain/data/vectors"
graph_dir = "brain/data/graph"
eval_queries = "evals/queries.jsonl"

[retrieval]
# top_k is deprecated; use min_hits/max_hits/pool_fraction instead.
# When set, it acts only as an explicit caller override cap.
top_k = 5
include_archive_fallback = true
pinned_token_budget = 2000
total_context_budget = 6000
bm25_weight = 0.30
semantic_weight = 0.25
type_prior_weight = 0.15
freshness_weight = 0.10
memory_strength_weight = 0.10
importance_weight = 0.10
quality_weight = 0.08
exact_alias_weight = 0.10
# Phase 6: multiplicative scoring + relevance gate
min_relevance_score = 0.25
bm25_saturation = 15.0
# Phase 4 (updated): dynamic top-k
min_hits = 3
max_hits = 15
pool_fraction = 0.10
tokens_per_hit_estimate = 120

[ingest]
chunk_tokens = 400
chunk_overlap_tokens = 50
default_archive_type = "session"
explicit_markers_only = false
auto_trigger_pipeline = true

[embeddings]
enabled = true
provider = "hash"
model = "hash-256-v1"
dimensions = 256
base_url = ""
api_key_env = ""
timeout_seconds = 60
reembed_on_summary_change_only = true

# Optional provider-shaped model config. These keys override the legacy
# [extraction] provider keys when present. Ollama remains supported, but any
# OpenAI-compatible endpoint can be used for text extraction.
#
# [models.llm]
# provider = "openai_compatible"
# model = "qwen3"
# base_url = "http://127.0.0.1:8000/v1"
# api_key_env = "OPENAI_API_KEY"
# timeout_seconds = 180
#
# [models.vlm]
# provider = "ollama"
# model = "llama3.2-vision:latest"
# base_url = "http://127.0.0.1:11434"
# timeout_seconds = 180

[graph]
enabled = true
focal_limit = 3
expand_limit = 8
graph_weight = 0.20

[trust]
min_training_samples = 8
current_query_stale_penalty = 0.30
current_query_contested_penalty = 0.65
historical_query_relief = 0.20
section_limit = 5

[promotion]
enabled = true
max_components_per_candidate = 50
max_candidates_per_run = 20
min_confidence_for_direct_write = "medium"
auto_review_on_conflict = true
retry_after_hours = 24

[jobs]
sync_on_startup = true
sync_after_ingest = true

[daemon]
socket_path = "brain/data/mnemonic.sock"
pid_path = "brain/data/mnemonic.pid"
log_path = "brain/logs/daemon.log"
max_pending = 200
max_oldest_age_minutes = 1440
stale_episode_threshold_hours = 2

[daemon.schedules]
process_extraction_queue = "*/5 * * * *"
process_promotion_queue = "*/5 * * * *"
expire_stale_episodes = "0 * * * *"
embed_backfill = "15 * * * *"
status_report = "0 * * * *"
wiki_embedding_neighbor_backfill = "20 * * * *"
wiki_cluster_validation = "25 * * * *"
wiki_pattern_discovery = "30 * * * *"
wiki_graph_rebuild = "35 * * * *"
wiki_lifecycle_audit = "40 * * * *"
wiki_importance_scoring = "45 * * * *"
wiki_health_report = "50 * * * *"
wiki_raw_revisitation = "0 2 * * *"
wiki_derive_passive_feedback = "*/30 * * * *"

[maintenance]
passive_feedback_enabled = true
passive_feedback_inline_only = false

[bridges.local_cli]
session_prefix = "local-cli"
can_promote = false

[bridges.automation]
session_prefix = "automation"
can_promote = true
